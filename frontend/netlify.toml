# Netlify configuration.
# In the Netlify UI set "Base directory" to `frontend` (this file is then found
# at the base root). Alternatively leave the base at the repository root and
# override the publish directory to `frontend/dist`.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# React Router needs every unknown path to resolve to the SPA entry point.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
